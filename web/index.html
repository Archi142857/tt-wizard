<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TT Wizard</title>
<meta name="description" content="서울대 관악캠퍼스 건물 사이 걷는 시간(경사 반영)으로 분반 조합을 골라 주는 시간표 도우미">
<meta name="theme-color" content="#f2f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TT Wizard">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="view-input" class="view">
  <header class="hero">
    <div class="brand-row">
      <div class="brand">TT Wizard</div>
      <button type="button" class="pill-btn" id="install" hidden>앱으로 설치</button>
    </div>
    <h1>걷는 시간이 가장 짧은<br>시간표를 찾아 드려요</h1>
    <p class="sub" id="data-note">자료를 불러오는 중…</p>
  </header>

  <div class="card search">
    <div class="term-row" id="term-row" hidden>
      <label for="year" class="sr-only">년도</label>
      <select id="year" class="term-select"></select>
      <label for="term" class="sr-only">학기</label>
      <select id="term" class="term-select"></select>
      <span class="term-tail">강좌에서 찾아요</span>
    </div>
    <div class="searchbox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="q" class="sr-only">과목 검색</label>
      <input id="q" type="search" placeholder="과목명, 교과목번호, 교수 이름" autocomplete="off" disabled>
    </div>
    <ul id="results" class="results" aria-live="polite"></ul>
  </div>

  <h2 class="section-title">담은 과목 <span class="count" id="picked-count"></span><span class="legend-slot" id="legend-input"></span></h2>
  <ul id="picked" class="picked"></ul>
  <div id="picked-empty" class="card picked-empty">위에서 과목을 검색해 담아 주세요</div>

  <h2 class="section-title">조건</h2>
  <div class="card settings">
    <div>
      <div class="field-label" id="home-label">출발·도착</div>
      <div class="seg" id="home-seg" role="group" aria-labelledby="home-label"></div>
      <label for="home-select" class="sr-only">다른 건물</label>
      <select id="home-select" class="select" hidden></select>
    </div>
    <div>
      <div class="field-label" id="mode-label">이동시간</div>
      <div class="seg" id="mode-seg" role="group" aria-labelledby="mode-label">
        <button type="button" data-mode="slope" aria-pressed="true">경사 반영</button>
        <button type="button" data-mode="flat" aria-pressed="false">평지 기준</button>
      </div>
      <p class="field-hint" id="mode-hint">오르막은 느리게, 완만한 내리막은 조금 빠르게 걷는다고 보고 계산해요.</p>
    </div>
  </div>
  <p class="error" id="input-error" role="alert" hidden></p>

  <footer class="credits" id="credits-input"></footer>
  <div class="bottom-bar"><button type="button" class="btn-primary" id="run" disabled>시간표 찾기</button></div>
</main>

<main id="view-result" class="view" hidden>
  <header class="navbar">
    <button type="button" class="icon-btn" id="back" aria-label="과목 고르기로 돌아가기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="title" id="result-heading">추천 시간표</div>
    <span class="mode-chip" id="mode-chip"></span>
  </header>

  <div class="daytabs" id="daytabs" role="tablist" aria-label="요일"></div>
  <div class="panes">
    <section class="card tt" id="tt" aria-label="하루 시간표"></section>
    <section class="card mapcard" aria-label="하루 동선 지도">
      <div id="map"></div>
      <ol class="legend" id="legend"></ol>
    </section>
  </div>
  <p class="day-summary" id="day-summary"></p>

  <h2 class="result-title" id="result-title"></h2>
  <div class="ranks" id="ranks"></div>
  <footer class="credits" id="credits-result"></footer>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
