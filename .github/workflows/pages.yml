# 웹 화면(web/)을 GitHub Pages 로 올린다.
# 켜는 법(한 번만): 레포 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로.
# main 에 푸시할 때, 그리고 수강편람 자동 갱신(sync-coursebook)이 끝날 때마다 자료를 다시 만들어 올린다
# (봇이 GITHUB_TOKEN 으로 푸시한 커밋은 push 이벤트를 만들지 않으므로 workflow_run 으로 받는다).

name: pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [sync-coursebook]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 중인 것은 끝까지(GitHub 기본 틀과 같게). 그 사이에 쌓인 실행만 건너뛴다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # ubuntu-latest 가 10/19 부터 Ubuntu 26 으로 바뀐다. 확인하기 전까지 24.04 로 묶어 둔다
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build web data
        # 표준 라이브러리만 써서 따로 설치할 것이 없다. --stamp: 스크립트·스타일 주소에 판(?v=)을 붙여
        # 배포 직후 새로고침해도 옛 스크립트가 남지 않게 한다
        run: python scripts/export_web.py --stamp
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
